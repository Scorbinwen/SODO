# YOLOv7
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-seg.yaml' will call yolo11-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 355 layers, 2876848 parameters, 2876832 gradients, 10.5 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 355 layers, 10113248 parameters, 10113232 gradients, 35.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 445 layers, 22420896 parameters, 22420880 gradients, 123.9 GFLOPs
  l: [1.00, 1.00, 512] # summary: 667 layers, 27678368 parameters, 27678352 gradients, 143.0 GFLOPs
  x: [1.00, 1.50, 512] # summary: 667 layers, 62142656 parameters, 62142640 gradients, 320.2 GFLOPs

# YOLOv7 backbone
backbone:
  # [from, number, module, args]
 - [-1, 1, Conv, [32, 3, 1]]  # 0

 - [-1, 1, Conv, [64, 3, 2]]  # 1-P1/2
 - [-1, 1, Conv, [64, 3, 1]]

 - [-1, 1, Conv, [128, 3, 2]]  # 3-P2/4
 - [-1, 1, Conv, [64, 1, 1]]
 - [-2, 1, Conv, [64, 1, 1]]
 - [-1, 1, Conv, [64, 3, 1]]
 - [-1, 1, Conv, [64, 3, 1]]
 - [-1, 1, Conv, [64, 3, 1]]
 - [-1, 1, Conv, [64, 3, 1]]
 - [[-1, -3, -5, -6], 1, Concat, [1]]
 - [-1, 1, Conv, [256, 1, 1]]  # 11

 - [-1, 1, MP, []]
 - [-1, 1, Conv, [128, 1, 1]]
 - [-3, 1, Conv, [128, 1, 1]]
 - [-1, 1, Conv, [128, 3, 2]]
 - [[-1, -3], 1, Concat, [1]]  # 16-P3/8
 - [-1, 1, Conv, [128, 1, 1]]
 - [-2, 1, Conv, [128, 1, 1]]
 - [-1, 1, Conv, [128, 3, 1]]
 - [-1, 1, Conv, [128, 3, 1]]
 - [-1, 1, Conv, [128, 3, 1]]
 - [-1, 1, Conv, [128, 3, 1]]
 - [[-1, -3, -5, -6], 1, Concat, [1]]
 - [-1, 1, Conv, [512, 1, 1]]  # 24

 - [-1, 1, MP, []]
 - [-1, 1, Conv, [256, 1, 1]]
 - [-3, 1, Conv, [256, 1, 1]]
 - [-1, 1, Conv, [256, 3, 2]]
 - [[-1, -3], 1, Concat, [1]]  # 29-P4/16
 - [-1, 1, Conv, [256, 1, 1]]
 - [-2, 1, Conv, [256, 1, 1]]
 - [-1, 1, Conv, [256, 3, 1]]
 - [-1, 1, Conv, [256, 3, 1]]
 - [-1, 1, Conv, [256, 3, 1]]
 - [-1, 1, Conv, [256, 3, 1]]
 - [[-1, -3, -5, -6], 1, Concat, [1]]
 - [-1, 1, Conv, [1024, 1, 1]]  # 37

 - [-1, 1, MP, []]
 - [-1, 1, Conv, [512, 1, 1]]
 - [-3, 1, Conv, [512, 1, 1]]
 - [-1, 1, Conv, [512, 3, 2]]
 - [[-1, -3], 1, Concat, [1]]  # 42-P5/32
 - [-1, 1, Conv, [256, 1, 1]]
 - [-2, 1, Conv, [256, 1, 1]]
 - [-1, 1, Conv, [256, 3, 1]]
 - [-1, 1, Conv, [256, 3, 1]]
 - [-1, 1, Conv, [256, 3, 1]]
 - [-1, 1, Conv, [256, 3, 1]]
 - [[-1, -3, -5, -6], 1, Concat, [1]]
 - [-1, 1, Conv, [1024, 1, 1]]  # 50


# yolov7 head
